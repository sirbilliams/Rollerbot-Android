# Desktop Flatpak of the Rollerbot port. The game's own files are NOT in the package: on first run
# the launcher asks for your game folder (the one containing Rollerbot.exe) and copies it to
# ~/.var/app/io.github.sirbilliams.Rollerbot/data/game (saves go there too).
# Build + install:  flatpak run org.flatpak.Builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.sirbilliams.Rollerbot.yml
app-id: io.github.sirbilliams.Rollerbot
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rollerbot-launcher
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # gamepads
  - --device=dri
modules:
  - name: rollerbot
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRB_TESTS=OFF
      - cmake --build build -j$FLATPAK_BUILDER_N_JOBS --target rollerbot
      - install -Dm755 build/src/platform/rollerbot /app/bin/rollerbot
      - install -Dm755 packaging/flatpak/rollerbot.sh /app/bin/rollerbot-launcher
      - install -Dm644 packaging/flatpak/io.github.sirbilliams.Rollerbot.desktop /app/share/applications/io.github.sirbilliams.Rollerbot.desktop
      - install -Dm644 packaging/flatpak/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.sirbilliams.Rollerbot.png
    sources:
      - type: git
        path: ../..
        branch: main
