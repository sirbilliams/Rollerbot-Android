name: Emulator smoke test

# Separate from build.yml on purpose: a flaky emulator can never block the APK build or the "latest" release.
# Builds its own x86_64 debug APK (-PemuAbi=x86_64 also exports RollerActivity for adb), boots an API 34
# emulator and checks the app starts, with no game data, a second display, and no crash.

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Android emulator smoke (API 34 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true      # reports red in the run but never fails the workflow/checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch SDL2 (pinned)
        run: bash fetch-deps.sh

      - name: Build x86_64 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PemuAbi=x86_64 assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test in the emulator
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/ci/emu-smoke.sh

      - name: Upload screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### Emulator smoke: job status \`${{ job.status }}\`"
            echo "Screenshots + logcat are in the \`emulator-smoke\` artifact."
            [ -s smoke/crash-lines.txt ] && { echo '```'; head -20 smoke/crash-lines.txt; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
